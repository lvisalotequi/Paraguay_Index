name: Diagnostico de bloqueos (temporal)

# PRUEBA TEMPORAL, se borra despues de usarla (no es parte del pipeline ni se documenta).
# Corre 4 jobs a la vez: cada uno cae en otro runner (otra IP) y pide, con el mismo cliente
# que usan los modulos (curl_cffi impersonate="chrome") y con `requests` normal como control,
# las paginas de BCP, MRE y fa_gov, mas state.gov como control que si funciona desde Actions.
# Solo mide el estado y los encabezados de Cloudflare. No descarga datos (salvo el Excel
# chico de remesas, 130 KB, para probar la ruta de descarga del BCP), no toca Drive ni Sheets
# y no usa secrets. El resumen queda en la pestana Summary de cada job.
on:
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "curl_cffi>=0.7" requests beautifulsoup4

      - name: Sondear
        run: |
          cat > sondeo.py <<'PY'
          import os, re, time
          import requests as rq
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cr

          SITIOS = {
              "BCP pagina remesas": "https://www.bcp.gov.py/remesas-familiares",
              "MRE indice": "https://www.mre.gov.py/archivo-de-noticias/",
              "fa_gov API": "https://foreignassistance.gov/api/country_dashboard/activities/PRY/0/2026/Obligations?page=1&pageSize=1",
              "state.gov (control)": "https://www.state.gov/treaties-in-force/",
          }
          filas = []


          def pedir(cliente, url):
              t = time.time()
              try:
                  if cliente == "curl_cffi chrome":
                      r = cr.get(url, impersonate="chrome", timeout=40)
                  else:
                      r = rq.get(url, timeout=40)
                  h = r.headers
                  return r, [str(r.status_code), h.get("cf-mitigated", "-"), h.get("server", "-"), f"{time.time() - t:.1f}s"]
              except Exception as exc:  # noqa: BLE001
                  return None, ["EXC " + type(exc).__name__, "-", "-", f"{time.time() - t:.1f}s"]


          try:
              info = rq.get("https://ipinfo.io/json", timeout=15).json()
              ip = f"{info.get('ip')} | {info.get('org')} | {info.get('country')}"
          except Exception as exc:  # noqa: BLE001
              ip = "no se pudo leer (" + type(exc).__name__ + ")"
          print("runner", os.environ.get("MATRIX_RUNNER"), "IP:", ip)

          enlace_bcp = None
          for sitio, url in SITIOS.items():
              for cliente in ("curl_cffi chrome", "requests (control)"):
                  r, datos = pedir(cliente, url)
                  filas.append([sitio, cliente] + datos)
                  if sitio == "BCP pagina remesas" and cliente == "curl_cffi chrome" and r is not None and r.status_code == 200:
                      a = BeautifulSoup(r.text, "html.parser").select_one('a[href*="/documents/"]')
                      enlace_bcp = a["href"] if a else None
                  time.sleep(2)
          if enlace_bcp:
              url = enlace_bcp if enlace_bcp.startswith("http") else "https://www.bcp.gov.py" + enlace_bcp
              r, datos = pedir("curl_cffi chrome", url)
              filas.append(["BCP descarga del archivo", "curl_cffi chrome"] + datos + [f"{len(r.content) if r is not None else 0} bytes"])

          tabla = ["| sitio | cliente | estado | cf-mitigated | server | tiempo |", "|---|---|---|---|---|---|"]
          tabla += ["| " + " | ".join(f) + " |" for f in filas]
          texto = f"### Runner {os.environ.get('MATRIX_RUNNER')}: {ip}\n\n" + "\n".join(tabla) + "\n"
          print(texto)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(texto)
          PY
          python sondeo.py
        env:
          MATRIX_RUNNER: ${{ matrix.runner }}
